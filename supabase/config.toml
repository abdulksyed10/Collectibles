project_id = "pin-keeper"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["pinkeeper://**"]
enable_signup = true
minimum_password_length = 10

[auth.email]
enable_signup = true
enable_confirmations = true

[functions.media]
# getUser(token) validates tokens in code, including new asymmetric signing keys.
verify_jwt = false
import_map = "./functions/media/deno.json"
entrypoint = "./functions/media/index.ts"
