project_id = "collectibles"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[auth]
enabled = true
site_url = "https://collectibles-three.vercel.app"
additional_redirect_urls = ["https://collectibles-three.vercel.app/**", "collectibles://**"]
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true

[functions.media]
# getUser(token) validates tokens in code, including new asymmetric signing keys.
verify_jwt = false
import_map = "./functions/media/deno.json"
entrypoint = "./functions/media/index.ts"

[functions.public-media]
verify_jwt = false
import_map = "./functions/media/deno.json"
entrypoint = "./functions/public-media/index.ts"

[functions.public-safety]
verify_jwt = false
import_map = "./functions/media/deno.json"
entrypoint = "./functions/public-safety/index.ts"

[functions.provider-grants]
verify_jwt = false
import_map = "./functions/media/deno.json"
entrypoint = "./functions/provider-grants/index.ts"
[functions.member-media]
verify_jwt = false
import_map = "./functions/media/deno.json"
entrypoint = "./functions/member-media/index.ts"
