<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f8f7f3;color:#253c35;font-family:Arial,sans-serif;">
    <main style="max-width:560px;margin:0 auto;padding:32px 24px;">
      <h1 style="margin:0 0 16px;font-size:26px;">Reset your Collectibles password</h1>
      <p style="line-height:1.5;">Enter this recovery code in Collectibles to choose a new password:</p>
      <p style="margin:24px 0;padding:16px;background:#ffffff;border:1px solid #e4e8e0;border-radius:12px;font-size:28px;font-weight:700;letter-spacing:5px;text-align:center;">{{ .Token }}</p>
      <p style="line-height:1.5;">Open <a href="{{ .SiteURL }}/auth/recovery">Collectibles password recovery</a> to enter the code. This code expires shortly and can be used once.</p>
      <p style="line-height:1.5;">If you did not request a password reset, you can safely ignore this email.</p>
    </main>
  </body>
</html>
