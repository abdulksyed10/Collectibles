name: Verify app
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-24.04
    env:
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_ENABLE_BACKEND: 'true'
      PLAYWRIGHT_BACKEND_FIXTURE: 'true'
      COLLECTIBLES_BUILD_MODE: fixture
      PLAYWRIGHT_CAPTCHA_FIXTURE: 'true'
      EXPO_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_fixture_not_a_secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.1'
          cache: npm
      - run: npm ci
      - run: node scripts/check-secrets.mjs --all
      - run: npm run typecheck
      - run: npm test
      - run: npx expo install --check
      - name: Compile web, Android and iOS bundles
        run: npx expo export --platform all --clear --max-workers 2
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build frontend without credentials
        run: npm run build:web
        env:
          EXPO_PUBLIC_ENABLE_BACKEND: 'false'
          EXPO_PUBLIC_SUPABASE_URL: ''
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ''
      - name: Verify isolated demo
        run: npm run test:e2e -- --grep demo
        env:
          PLAYWRIGHT_BACKEND_FIXTURE: 'false'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.6
      - run: deno task --config supabase/functions/media/deno.json check
